name: Release builds

on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # OCR languages shipped with every package (tessdata_fast); `--lang auto` chooses among them.
  TESSDATA_LANGS: eng deu fra spa ita por nld
  TESSDATA_URL: https://github.com/tesseract-ocr/tessdata_fast/raw/main

jobs:
  windows:
    runs-on: windows-2022
    env:
      VCPKG_TRIPLET: x64-windows-release
      # Code signing runs only when the certificate secrets are configured.
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-tesseract-${{ env.VCPKG_TRIPLET }}-v1
      - name: Install Tesseract (vcpkg)
        shell: pwsh
        run: |
          $cache = "${{ github.workspace }}\vcpkg-cache"
          New-Item -ItemType Directory -Force $cache | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = $cache
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "tesseract:$env:VCPKG_TRIPLET"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\$env:VCPKG_TRIPLET"
          $lib = Get-ChildItem "$root\lib" -Filter "tesseract*.lib" | Select-Object -First 1
          "TESSERACT_LIB_DIR=$root\lib" | Out-File -Append $env:GITHUB_ENV
          "TESSERACT_LIB_NAME=$($lib.BaseName)" | Out-File -Append $env:GITHUB_ENV
          "VCPKG_BIN=$root\bin" | Out-File -Append $env:GITHUB_ENV
      - name: Build
        shell: pwsh
        run: |
          $env:QMAKE = "$env:QT_ROOT_DIR\bin\qmake.exe"
          cargo build --release -p pdf2word -p pdf2word-gui
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Package (portable folder)
        shell: pwsh
        run: |
          $dist = "dist\pdf2word-windows-x64"
          New-Item -ItemType Directory -Force $dist, "$dist\tessdata" | Out-Null
          Copy-Item target\release\pdf2word.exe, target\release\pdf2word-gui.exe $dist
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --qmldir crates\gui\qml "$dist\pdf2word-gui.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "$env:VCPKG_BIN\*.dll" $dist
          bash tools/fetch-pdfium.sh "$dist" win-x64
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($lang in $env:TESSDATA_LANGS.Split(' ')) {
            Invoke-WebRequest "$env:TESSDATA_URL/$lang.traineddata" -OutFile "$dist\tessdata\$lang.traineddata"
          }
          Copy-Item packaging\windows\README.txt $dist
      - name: Sign the programs (when a certificate is configured)
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # WINDOWS_CERTIFICATE: base64 of a code-signing .pfx; WINDOWS_CERTIFICATE_PASSWORD: its password.
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          "SIGNTOOL=$($signtool.FullName)" | Out-File -Append $env:GITHUB_ENV
          $dist = "dist\pdf2word-windows-x64"
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "$dist\pdf2word.exe" "$dist\pdf2word-gui.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          "APP_VERSION=$ver" | Out-File -Append $env:GITHUB_ENV
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DSourceDir=$PWD\dist\pdf2word-windows-x64" "/DAppVersion=$ver" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Sign the installer (when a certificate is configured)
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $setup = Get-ChildItem dist -Filter "pdf2word-setup-*.exe" | Select-Object -First 1
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"
      - name: Smoke test (portable CLI, text and OCR)
        shell: pwsh
        run: |
          $dist = "dist\pdf2word-windows-x64"
          & "$dist\pdf2word.exe" crates\core\tests\fixtures\report.pdf -o smoke.docx
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$dist\pdf2word.exe" crates\core\tests\fixtures\invoice.pdf -o smoke-ocr.docx --ocr always 2>&1 | Tee-Object ocr.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Select-String -Path ocr.log -Pattern "OCR unavailable") { Write-Error "OCR not working"; exit 1 }
      - name: Smoke test (installer)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter "pdf2word-setup-*.exe" | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/DIR=C:\pdf2word-test', '/TASKS=' -Wait
          & C:\pdf2word-test\pdf2word.exe crates\core\tests\fixtures\math.pdf -o installed.docx
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Smoke test (GUI starts and loads its QML)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist\pdf2word-windows-x64\pdf2word-gui.exe").Path
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_FORCE_STDERR_LOGGING = "1"
          $p = Start-Process $exe -ArgumentList "crates\core\tests\fixtures\report.pdf" -PassThru -RedirectStandardError gui.err -RedirectStandardOutput gui.out
          Start-Sleep -Seconds 15
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          if (-not $alive) { Get-Content gui.err; Write-Error "GUI exited early (code $($p.ExitCode))"; exit 1 }
          if (Select-String -Path gui.err -Pattern "is not installed|failed to load|QQmlApplicationEngine failed|Cannot load library") { Get-Content gui.err; Write-Error "QML failed to load"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: pdf2word-windows-x64-portable
          path: dist/pdf2word-windows-x64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pdf2word-windows-x64-installer
          path: dist/pdf2word-setup-*.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            pdfium: mac-arm64
          - runner: macos-15-intel
            arch: x86_64
            pdfium: mac-x64
    runs-on: ${{ matrix.runner }}
    env:
      # Developer ID signing and notarisation run only when their secrets are configured.
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: mac
          target: desktop
          arch: clang_64
          cache: true
      - name: Install Tesseract
        run: brew install tesseract pkgconf
      - name: Build
        run: QMAKE="$QT_ROOT_DIR/bin/qmake" cargo build --release -p pdf2word -p pdf2word-gui
      - name: Bundle (.app)
        run: |
          set -euo pipefail
          APP="dist/PDF to Word.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/tessdata" "$APP/Contents/Frameworks"
          cp target/release/pdf2word-gui target/release/pdf2word "$APP/Contents/MacOS/"
          cp packaging/macos/Info.plist "$APP/Contents/"
          cp packaging/icons/pdf2word.icns "$APP/Contents/Resources/"
          tools/fetch-pdfium.sh "$APP/Contents/Frameworks" ${{ matrix.pdfium }}
          for lang in $TESSDATA_LANGS; do
            curl -fsSL -o "$APP/Contents/Resources/tessdata/$lang.traineddata" "$TESSDATA_URL/$lang.traineddata"
          done
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" -qmldir=crates/gui/qml -executable="$APP/Contents/MacOS/pdf2word"
          # Homebrew libraries macdeployqt misses (@rpath between non-Qt libraries).
          tools/macos-bundle-deps.sh "$APP"
      - name: Sign (Developer ID when configured, ad hoc otherwise)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="dist/PDF to Word.app"
          if [ "$HAS_SIGNING_CERT" = "true" ]; then
            # MACOS_CERTIFICATE: base64 of a Developer ID Application .p12; MACOS_SIGNING_IDENTITY:
            # e.g. "Developer ID Application: Name (TEAMID)".
            KC="$RUNNER_TEMP/signing.keychain-db"
            security create-keychain -p "$RUNNER_TEMP" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$RUNNER_TEMP" "$KC"
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$KC" > /dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$APP"
            codesign --verify --deep --strict "$APP"
          else
            # Ad-hoc signature (required for Apple Silicon binaries to run at all).
            codesign --force --deep --sign - "$APP"
          fi
      - name: Disk image
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          DMG="dist/pdf2word-$ver-macos-${{ matrix.arch }}.dmg"
          hdiutil create -volname "PDF to Word" -srcfolder "dist/PDF to Word.app" -ov -format UDZO "$DMG"
          if [ "$HAS_SIGNING_CERT" = "true" ]; then
            codesign --sign "$MACOS_SIGNING_IDENTITY" --timestamp "$DMG"
            if [ "$HAS_NOTARY" = "true" ]; then
              # APPLE_APP_PASSWORD: an app-specific password of the Apple ID.
              xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
              xcrun stapler staple "$DMG"
            fi
          fi
      - name: Smoke test
        run: |
          set -euo pipefail
          BIN="dist/PDF to Word.app/Contents/MacOS"
          "$BIN/pdf2word" crates/core/tests/fixtures/report.pdf -o smoke.docx
          "$BIN/pdf2word" crates/core/tests/fixtures/invoice.pdf -o smoke-ocr.docx --ocr always 2>&1 | tee ocr.log
          ! grep -q "OCR unavailable" ocr.log
          QT_QPA_PLATFORM=offscreen PDF2WORD_SCREENSHOT="$PWD/gui.png" "$BIN/pdf2word-gui" crates/core/tests/fixtures/report.pdf > gui.log 2>&1 &
          pid=$!
          sleep 25
          if kill -0 $pid 2>/dev/null; then kill $pid; cat gui.log; echo "GUI did not finish"; exit 1; fi
          ! grep -E "is not installed|failed to load|QQmlApplicationEngine failed" gui.log
          test -s gui.png
      - uses: actions/upload-artifact@v4
        with:
          name: pdf2word-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tesseract and Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libtesseract-dev libleptonica-dev libfuse2 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libegl1 libgl1
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
      - name: Build
        run: QMAKE="$QT_ROOT_DIR/bin/qmake" cargo build --release -p pdf2word -p pdf2word-gui
      - name: AppImage
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/lib AppDir/usr/share/tessdata dist
          tools/fetch-pdfium.sh AppDir/usr/lib linux-x64
          for lang in $TESSDATA_LANGS; do
            curl -fsSL -o "AppDir/usr/share/tessdata/$lang.traineddata" "$TESSDATA_URL/$lang.traineddata"
          done
          for t in linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage; do
            curl -fsSL -o "$t" "https://github.com/linuxdeploy/${t%-x86_64.AppImage}/releases/download/continuous/$t"
            chmod +x "$t"
          done
          export APPIMAGE_EXTRACT_AND_RUN=1 QMAKE="$QT_ROOT_DIR/bin/qmake" QML_SOURCES_PATHS="$PWD/crates/gui/qml"
          export EXTRA_PLATFORM_PLUGINS="libqoffscreen.so" LD_LIBRARY_PATH="$QT_ROOT_DIR/lib"
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          export LDAI_OUTPUT="dist/pdf2word-$ver-linux-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e target/release/pdf2word-gui -e target/release/pdf2word \
            -d packaging/linux/pdf2word.desktop -i packaging/icons/pdf2word.png \
            --plugin qt --output appimage
      - name: Smoke test
        run: |
          set -euo pipefail
          AppDir/usr/bin/pdf2word crates/core/tests/fixtures/report.pdf -o smoke.docx
          AppDir/usr/bin/pdf2word crates/core/tests/fixtures/invoice.pdf -o smoke-ocr.docx --ocr always 2>&1 | tee ocr.log
          ! grep -q "OCR unavailable" ocr.log
          # The GUI loads its QML, shows the PDF, saves a screenshot and quits by itself.
          export APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen PDF2WORD_SCREENSHOT="$PWD/gui.png"
          timeout 60 dist/*.AppImage crates/core/tests/fixtures/report.pdf > gui.log 2>&1 || { cat gui.log; echo "GUI failed"; exit 1; }
          ! grep -E "is not installed|failed to load|QQmlApplicationEngine failed" gui.log
          test -s gui.png
      - uses: actions/upload-artifact@v4
        with:
          name: pdf2word-linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip the portable Windows folder
        run: cd artifacts && zip -qr pdf2word-windows-x64-portable.zip pdf2word-windows-x64-portable
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pdf2word-windows-x64-portable.zip
            artifacts/pdf2word-windows-x64-installer/*.exe
            artifacts/pdf2word-macos-arm64/*.dmg
            artifacts/pdf2word-macos-x86_64/*.dmg
            artifacts/pdf2word-linux-x86_64/*.AppImage
