name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tesseract and Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libtesseract-dev libleptonica-dev tesseract-ocr-eng \
            qt6-base-dev qt6-declarative-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fetch PDFium
        run: tools/fetch-pdfium.sh "$PWD/pdfium"
      - name: Test (core + CLI)
        env:
          PDFIUM_DYNAMIC_LIB_PATH: ${{ github.workspace }}/pdfium
        run: cargo test --workspace --exclude pdf2word-gui
      - name: Clippy
        env:
          QMAKE: /usr/bin/qmake6
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build GUI
        env:
          QMAKE: /usr/bin/qmake6
        run: cargo build -p pdf2word-gui --release
