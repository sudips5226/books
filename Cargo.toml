[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gui"]
# The GUI needs Qt 6 development files; build it explicitly with `cargo build -p pdf2word-gui`.
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
log = "0.4"

[profile.release]
lto = "thin"
