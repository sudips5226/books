[package]
name = "pdf2word"
description = "Command-line PDF to Word (DOCX) converter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["ocr"]
ocr = ["pdf2word-core/ocr"]

[dependencies]
anyhow.workspace = true
log.workspace = true
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
pdf2word-core = { path = "../core", default-features = false }
